# Consensus layer clients (beacon node) and validator clients.
# CL clients with a built-in VC declare embeds: [validator].
- slug: lighthouse
  name: Lighthouse
  vendor: Sigma Prime
  summary: Rust consensus client with beacon node and validator client binaries.
  roles: [consensus, validator]
  embeds: [validator]
  repo: sigp/lighthouse
  stable_tag_pattern: '^v\d+\.\d+\.\d+$'
  homepage: https://lighthouse.sigmaprime.io
  docs: https://lighthouse-book.sigmaprime.io
  docker_image: sigp/lighthouse
  language: Rust
  license: Apache-2.0
  networks: [mainnet, hoodi, sepolia, holesky, ephemery]
  status: active
  assessor: lighthouse-table
  supports: { charon: true, web3signer: true, mev_boost: true, commit_boost: true, keymanager_api: true, doppelganger: true }
  priority_weight: 1.5
  tags: [cl, vc]

