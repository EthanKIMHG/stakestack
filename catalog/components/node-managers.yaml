# Node managers / orchestrators / installers
- slug: eth-docker
  name: Eth Docker
  vendor: EthStaker
  summary: Docker-compose based node orchestration supporting every major EL/CL/VC plus MEV-Boost and monitoring.
  roles: [node-manager]
  repo: eth-educators/eth-docker
  stable_tag_pattern: '^v\d+\.\d+\.\d+(\.\d+)?$'
  docs: https://ethdocker.com
  language: Shell
  license: Apache-2.0
  networks: [mainnet, hoodi, sepolia, holesky, ephemery]
  status: active
  assessor: generic
  priority_weight: 1.1
  tags: [compose, orchestrator]
  notes: Release notes state minimum client versions and whether a release is mandatory; the generic assessor picks up "mandatory"/"required".

