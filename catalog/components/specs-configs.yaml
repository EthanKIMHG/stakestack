# Protocol specs, network configs and coordination repos (watch-only).
# These do not go in a slot; they feed the fork-wave timeline and the
# "what changed in the protocol" context on each upgrade page.
- slug: consensus-specs
  name: Consensus specs
  vendor: Ethereum Foundation
  summary: Beacon chain specifications. Tagged releases mark fork spec freezes (alpha/beta/rc).
  roles: [spec]
  repo: ethereum/consensus-specs
  stable_tag_pattern: '^v\d+\.\d+\.\d+$'
  language: Python
  license: CC0-1.0
  status: active
  assessor: generic
  priority_weight: 0.8
  tags: [spec, cl]

