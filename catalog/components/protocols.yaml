# Staking protocol integrations and their operator sidecars
- slug: lido-csm
  name: Lido Community Staking Module (operator)
  vendor: Lido
  summary: Permissionless Lido module. Operators run their own stack plus the validator-ejector.
  roles: [protocol]
  repo: lidofinance/community-staking-module
  stable_tag_pattern: '^v\d+\.\d+\.\d+$'
  docs: https://docs.lido.fi/run-on-lido/csm
  language: Solidity
  license: GPL-3.0
  networks: [mainnet, hoodi, holesky]
  status: active
  assessor: generic
  priority_weight: 1.1
  tags: [lido, csm]

- slug: lido-simple-dvt
  name: Lido SimpleDVT (operator)
  vendor: Lido
  summary: Lido module for DVT clusters (Obol / SSV). Regular clusters were wound down in 2026; Super Clusters remain.
  roles: [protocol]
  repo: lidofinance/lido-dao
  stable_tag_pattern: '^v\d+\.\d+\.\d+$'
  docs: https://docs.lido.fi/run-on-lido/simple-dvt
  language: Solidity
  license: GPL-3.0
  networks: [mainnet, hoodi, holesky]
  status: maintenance
  assessor: generic
  priority_weight: 0.8
  tags: [lido, dvt]
  notes: The Lido DAO wound down regular Simple DVT clusters from 2026-07-01 (completed 2026-09-18). New DVT operators are pointed to CSM.

