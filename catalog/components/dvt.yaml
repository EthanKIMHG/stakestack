  repo: ObolNetwork/charon
  stable_tag_pattern: '^v\d+\.\d+\.\d+$'
  homepage: https://obol.org
  docs: https://docs.obol.org
  docker_image: obolnetwork/charon
  language: Go
  license: BUSL-1.1
  networks: [mainnet, hoodi, sepolia, holesky]
  status: active
  assessor: charon-notes
  priority_weight: 1.5
  tags: [dvt-middleware, dvt, obol]
