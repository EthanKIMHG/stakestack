# Networks, fork waves and per-network upgrades.
#
# A fork ships as a *wave*: the same upgrade activates on Sepolia, then Hoodi,
# then Mainnet (Holesky is sunset; Ephemery resets). Validators who run on
# testnets must upgrade weeks before mainnet, and the required client versions
# differ per network (testnet releases are often pre-releases or -rc tags).
# stakestack therefore tracks readiness per (stack, network), not per stack.
#
# `required_versions` is the authoritative table from the EF announcement post
# and MUST be edited by a human. The ingester only drafts entries from
# UPGRADE_FEED_URLS with status: draft. `verified: false` marks values that still
# need a source link; the UI shows them as "unconfirmed".

networks:
  - id: sepolia
    name: Sepolia
    kind: testnet
    chain_id: 11155111
    config_repo: eth-clients/sepolia
    rollout_order: 1
    description: First public testnet in the wave. Permissioned validator set; most operators observe rather than validate here.
  - id: hoodi
    name: Hoodi
    kind: testnet
    chain_id: 560048
    config_repo: eth-clients/hoodi
    rollout_order: 2
    description: Open validator testnet (Holesky successor). This is where staking operators rehearse the upgrade with their real stack.
  - id: mainnet
    name: Ethereum Mainnet
    kind: mainnet
    chain_id: 1
    config_repo: eth-clients/mainnet
    rollout_order: 3
  - id: holesky
    name: Holesky
    kind: testnet
    chain_id: 17000
    config_repo: eth-clients/holesky
    rollout_order: 0
    deprecated: true
    description: Sunset. Kept for historical upgrade records only.
  - id: ephemery
    name: Ephemery
    kind: ephemeral
    config_repo: ephemery-testnet/ephemery-genesis
    rollout_order: 0
    description: Resets on a schedule; forks are enabled from genesis after each reset.

# Default rollout order used by the UI timeline and by readiness ranking.
rollout_sequence: [sepolia, hoodi, mainnet]

# A wave groups one fork across networks. `upgrades` below reference a wave.
waves:
  - id: pectra
    name: Pectra (Prague + Electra)
    status: completed
    meta_eip: https://eips.ethereum.org/EIPS/eip-7600
  - id: fusaka
    name: Fusaka (Fulu + Osaka)
    status: completed
    meta_eip: https://eips.ethereum.org/EIPS/eip-7607
  - id: glamsterdam
    name: Glamsterdam (Gloas + Amsterdam)
    status: in_progress
    meta_eip: https://eips.ethereum.org/EIPS/eip-7773
  - id: hegota
    name: Hegota (Heze + Bogota)
    status: planning
    meta_eip: null

