    verified: false
    required_versions: {}
  - id: fusaka-hoodi
    wave: fusaka
    network: hoodi
    status: activated
    activation_time: "2025-10-28T00:00:00Z"
    announcement: https://blog.ethereum.org/2025/09/26/fusaka-testnet-announcement
