    wave: pectra
    network: holesky
    status: activated
    activation_epoch: 115968
    activation_time: "2025-02-24T21:55:12Z"
    announcement: https://blog.ethereum.org/2025/02/14/pectra-testnet-announcement
    verified: false
    required_versions: {}
  - id: pectra-sepolia
    wave: pectra
    network: sepolia
    status: activated
    activation_epoch: 222464
    activation_time: "2025-03-05T07:29:36Z"
    announcement: https://blog.ethereum.org/2025/02/14/pectra-testnet-announcement
    verified: false
    required_versions: {}
  - id: pectra-hoodi
    wave: pectra
    network: hoodi
    status: activated
    activation_epoch: 2048
    activation_time: "2025-03-26T15:56:48Z"
    announcement: https://blog.ethereum.org/2025/03/18/hoodi-release
    verified: false
    required_versions: {}
  - id: pectra-mainnet
    wave: pectra
    network: mainnet
    status: activated
    activation_epoch: 364032
    activation_time: "2025-05-07T10:05:11Z"
    announcement: https://blog.ethereum.org/2025/04/23/pectra-mainnet
    verified: true
    required_versions: {}

  # ------------------------------------------------------------------ Fusaka --
  - id: fusaka-holesky
    wave: fusaka
    network: holesky
