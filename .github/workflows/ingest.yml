name: ingest

on:
  schedule:
    # Twice an hour at :07 and :37. GitHub delays or drops scheduled runs at :00 and :30
    # (peak load); with */30 we observed only one run every 3-5 hours.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: Fetch INGEST_BACKFILL_RELEASES_PER_REPO for every repo
        type: boolean
        default: false
      dry_run:
        description: Do not write to Supabase
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Same environment as the catalog sync job, so secrets stored as `production`
    # environment secrets (not only repository secrets) are visible here too.
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # ETag + cursor cache. Restoring it is what keeps advisories polling free (304s).
      - uses: actions/cache@v4
        with:
          path: packages/ingest/.cache
          key: ingest-state-${{ github.run_id }}
          restore-keys: ingest-state-
      - name: check configuration
        env:
          HAS_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
          HAS_SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
          HAS_PAT: ${{ secrets.STAKESTACK_GITHUB_TOKEN != '' }}
          HAS_REVALIDATE: ${{ secrets.REVALIDATE_SECRET != '' }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          missing=""
          [ "$HAS_SUPABASE_URL" = "true" ] || missing="$missing secret:NEXT_PUBLIC_SUPABASE_URL"
          [ "$HAS_SUPABASE_SECRET" = "true" ] || missing="$missing secret:SUPABASE_SECRET_KEY"
          if [ -n "$missing" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::error::Missing required configuration:$missing. Add them as repository secrets or as secrets of the 'production' environment (Settings > Secrets and variables > Actions, or Settings > Environments > production)."; exit 1
          fi
          if [ "$HAS_PAT" = "true" ]; then echo "GitHub token: STAKESTACK_GITHUB_TOKEN (personal access token)"; else echo "GitHub token: built-in github.token (repo-scoped, 1,000 req/h)"; fi
          [ "$HAS_REVALIDATE" = "true" ] || echo "::warning::REVALIDATE_SECRET not set; pages refresh on the 5-minute ISR window instead of immediately"
          [ -n "$SITE_URL" ] || echo "::warning::Variable NEXT_PUBLIC_SITE_URL not set; cache revalidation is skipped"

      - name: ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # A dedicated PAT if configured, otherwise the workflow's own token. One run costs ~2 GraphQL
          # points and the built-in token has its own repo-scoped budget, so it never competes with
          # other projects' personal quota. See docs/GITHUB_API_SPEC.md.
          GITHUB_TOKEN: ${{ secrets.STAKESTACK_GITHUB_TOKEN || github.token }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          INGEST_GRAPHQL_BUDGET_POINTS_PER_RUN: ${{ vars.INGEST_GRAPHQL_BUDGET_POINTS_PER_RUN || 25 }}
          INGEST_REST_BUDGET_REQUESTS_PER_RUN: ${{ vars.INGEST_REST_BUDGET_REQUESTS_PER_RUN || 120 }}
          # The built-in token has a 1,000/h budget, so the "leave this much for others" floor must be lower.
          INGEST_MIN_REMAINING_POINTS: ${{ vars.INGEST_MIN_REMAINING_POINTS || (secrets.STAKESTACK_GITHUB_TOKEN && '1000' || '100') }}
          INGEST_MIN_REMAINING_REST: ${{ vars.INGEST_MIN_REMAINING_REST || (secrets.STAKESTACK_GITHUB_TOKEN && '1000' || '100') }}
          INGEST_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          INGEST_USER_AGENT: stakestack-ingest/0.1 (+https://github.com/${{ github.repository }})
        run: pnpm ingest ${{ inputs.backfill && '-- --backfill' || '' }}
